# dependencies
highlighter:      rouge
kramdown:
  auto_ids:       true
markdown:         kramdown

# minify
compress_html:
  blanklines:     true
  clippings:      all

# permalinks
permalink:        pretty

# plugins
plugins:
                  - jekyll-redirect-from
                  - jekyll-sitemap
                  - jekyll-toc

# server
baseurl:          "/material" # workaround for our GitHub Pages hosting
destination:      "gh-pages/material" # workaround for our GitHub Pages hosting
encoding:         "UTF-8"
exclude:          
                  - .babelrc.js
                  - .tmp/
                  - .git
                  - .gitignore
                  - .sass-cache/
                  - AGENTS.md
                  - assets/
                  - bower.json
                  - build/
                  - CLAUDE.md
                  - docs-assets/
                  - Gemfile
                  - Gemfile.lock
                  - gh-pages/
                  - lint-vars.sh
                  - node_modules/
                  - package.json
                  - package-lock.json
                  - README.md
host:             0.0.0.0
port:             9999
source:           "."
url:              "https://daemonite.github.io"

# social
authors:          "Daemonite"
description:      "Daemonite's Material UI is a cross-platform and fully responsive front-end interface based on Google Material Design developed using Bootstrap 4."
title:            "Material"

# toc
toc:
  max_level:      4
  min_level:      2
  # Keep headings in live examples and modals out of the page TOC.
  no_toc_section_class: [no_toc_section, bd-example, modal]

# vars
cdn:
  bs_css:         "https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
  # Bootstrap's own docs stylesheet (callouts, examples, TOC). Kept at 4.1: the 4.6 one changes
  # the docs' spacing and makes several pages overflow horizontally at 1280px.
  bs_css_docs:    "https://getbootstrap.com/docs/4.1/assets/css/docs.min.css"
  bs_css_hash:    "sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
  bs_js:          "https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
  bs_js_hash:     "sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+"
  jquery:         "https://code.jquery.com/jquery-3.8.0.slim.min.js"
  jquery_hash:    "sha384-V78UfKsTRKnoybouv82wMPQtWgGGMk49PtKNw8mgMrjzNHRloLpRruWrj4F1e0Pd"
  md_font:        "https://fonts.googleapis.com/css?family=Roboto:300,300i,400,400i,500,500i,700,700i%7CRoboto+Mono:300,400,700%7CRoboto+Slab:300,400,700"
  md_icon:        "https://fonts.googleapis.com/icon?family=Material+Icons"
  popper:         "https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
  popper_hash:    "sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
bootstrap_version: "4.6.2"
current_version:  "4.1.1"
# Holder.js placeholder images (`<img {{ site.holder_img_attrs }} data-src="holder.js/...">`).
# The transparent GIF gives each image a valid `src`; `data-holder-rendered`
# makes Holder draw the `data-src` placeholder over it anyway (Holder keeps any
# `src` that loads otherwise). `_includes/example.html` hides both in snippets.
holder_img_attrs: 'src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" data-holder-rendered="true"'
docs_version:     "4.6"
download:
  source:         "https://github.com/Daemonite/material/archive/v4.1.1.zip"
  dist:           "https://github.com/Daemonite/material/releases/download/v4.1.1/material-4.1.1-dist.zip"
id:
  main:           "doc-main-h1"
  navbar:         "doc-navbar"
  navdrawer:      "doc-navdrawer"
repo:             "https://github.com/Daemonite/material"
